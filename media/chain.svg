<svg xmlns="http://www.w3.org/2000/svg" width="960" height="272" viewBox="0 0 960 272" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ct cd">
<title id="ct">The recurrence</title>
<desc id="cd">Stage i publishes a state S_i; a nonce x_i whose puzzle hash falls below the target produces S_(i+1), and the same rule applies again. A sealed AES-256-GCM payload ships alongside.</desc>
<rect width="960" height="272" rx="10" fill="#fcfcfb"/>
<text x="64" y="38" fill="#0b0b0b" font-size="20" font-weight="600">The recurrence</text>
<text x="64" y="62" fill="#52514e" font-size="13">Each solution is the only input to the next stage. Below: the real first stages of the live challenge.</text>
<rect x="40" y="96" width="170" height="64" rx="8" fill="#f3f2ee" stroke="#c3c2b7"/>
<text x="54" y="120" fill="#0b0b0b" font-size="14" font-weight="600">S<tspan font-size="10" dy="4">0</tspan></text>
<text x="54" y="142" fill="#52514e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">d9ebb868…c3ab6f</text>
<line x1="214" y1="128.0" x2="264" y2="128.0" stroke="#2a78d6" stroke-width="2"/>
<path d="M264,123.0 l8,5 l-8,5 z" fill="#2a78d6"/>
<text x="241.0" y="86" text-anchor="middle" fill="#52514e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x<tspan font-size="9" dy="3">0</tspan><tspan dy="-3">=51,741,039</tspan></text>
<rect x="272" y="96" width="170" height="64" rx="8" fill="#f3f2ee" stroke="#c3c2b7"/>
<text x="286" y="120" fill="#0b0b0b" font-size="14" font-weight="600">S<tspan font-size="10" dy="4">1</tspan></text>
<text x="286" y="142" fill="#52514e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">8b41f221…9b892f</text>
<line x1="446" y1="128.0" x2="496" y2="128.0" stroke="#2a78d6" stroke-width="2"/>
<path d="M496,123.0 l8,5 l-8,5 z" fill="#2a78d6"/>
<text x="473.0" y="86" text-anchor="middle" fill="#52514e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x<tspan font-size="9" dy="3">1</tspan><tspan dy="-3">=181,888,867</tspan></text>
<rect x="504" y="96" width="170" height="64" rx="8" fill="#f3f2ee" stroke="#c3c2b7"/>
<text x="518" y="120" fill="#0b0b0b" font-size="14" font-weight="600">S<tspan font-size="10" dy="4">2</tspan></text>
<text x="518" y="142" fill="#52514e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">c32e9524…ca78d9</text>
<line x1="678" y1="128.0" x2="728" y2="128.0" stroke="#2a78d6" stroke-width="2"/>
<path d="M728,123.0 l8,5 l-8,5 z" fill="#2a78d6"/>
<text x="705.0" y="86" text-anchor="middle" fill="#52514e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">x<tspan font-size="9" dy="3">2</tspan><tspan dy="-3">=53,090,329</tspan></text>
<rect x="736" y="96" width="170" height="64" rx="8" fill="#f3f2ee" stroke="#c3c2b7"/>
<text x="750" y="120" fill="#0b0b0b" font-size="14" font-weight="600">S<tspan font-size="10" dy="4">3</tspan></text>
<text x="750" y="142" fill="#52514e" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">92a3bdea…2c9198</text>
<text x="916" y="134.0" fill="#2a78d6" font-size="22" font-weight="600">⋯</text>
<text x="64" y="200" fill="#0b0b0b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">valid(x) ⇔ SHA256("RCP|puzzle|" ‖ i ‖ S<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> ‖ x) &lt; 2</tspan><tspan font-size="9" dy="-6">256−26</tspan></text>
<text x="64" y="224" fill="#0b0b0b" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">S<tspan font-size="9" dy="3">i+1</tspan><tspan dy="-3"> = SHA256("RCP|next|" ‖ i ‖ S</tspan><tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> ‖ x</tspan><tspan font-size="9" dy="3">i</tspan><tspan dy="-3">)</tspan></text>
<rect x="600" y="178" width="320" height="62" rx="8" fill="none" stroke="#52514e" stroke-dasharray="5 4"/>
<text x="614" y="202" fill="#0b0b0b" font-size="13" font-weight="600">sealed payload · 208 bytes</text>
<text x="614" y="222" fill="#52514e" font-size="12">AES-256-GCM · Argon2id 512 MiB × 3</text>
</svg>
