<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="dt dd">
<title id="dt">Seconds per stage at every difficulty</title>
<desc id="dd">Expected wall-clock seconds to solve one stage, 2^d divided by the measured hash rate, for one thread and for all threads, on a log scale.</desc>
<rect width="960" height="420" rx="10" fill="#fcfcfb"/>
<text x="64" y="38" fill="#0b0b0b" font-size="20" font-weight="600">What one more bit of difficulty costs</text>
<text x="64" y="62" fill="#52514e" font-size="13">Expected time per stage = 2ᵈ ÷ measured hash rate, log scale. Each bit doubles it. The live challenge runs at d = 26.</text>
